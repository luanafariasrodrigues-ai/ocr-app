<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>OCR Scanner</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { color: #333; }
    form { background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    input, select, button { display: block; width: 100%; margin-top: 12px; padding: 10px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #4f46e5; color: #fff; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #4338ca; }
    #resultado { margin-top: 24px; background: #fff; padding: 20px; border-radius: 10px; white-space: pre-wrap; min-height: 80px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  </style>
</head>
<body>
  <h1>OCR Scanner</h1>
  <form id="form">
    <input type="file" name="image" accept="image/*" required>
    <select name="lang">
      <option value="por+eng">Português + Inglês</option>
      <option value="por">Português</option>
      <option value="eng">Inglês</option>
    </select>
    <button type="submit">Extrair Texto</button>
  </form>
  <div id="resultado">O texto extraído aparecerá aqui...</div>

  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      document.getElementById("resultado").textContent = "Processando...";
      const res = await fetch("/ocr", { method: "POST", body: form });
      const data = await res.json();
      document.getElementById("resultado").textContent = data.texto || data.error;
    });
  </script>
</body>
</html>
