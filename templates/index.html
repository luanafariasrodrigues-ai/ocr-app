<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OCR Web App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            width: 500px;
            text-align: center;
        }

        input, button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
        }

        button {
            background: #4cafef;
            border: none;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3a9ad9;
        }
    </style>
</head>

<body>

<h1>OCR Web App</h1>

<div class="card">

    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <button type="submit">Read Image</button>
    </form>

</div>

</body>
</html>
